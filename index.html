
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кофемастер PRO — частный мастер</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px 16px;
      background: #151515;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .master-banner {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 18px;
      border: 1px solid #c88929;
      box-shadow: 0 0 25px rgba(232, 173, 80, 0.2);
      margin-bottom: 25px;
    }

    h1 {
      color: #f0a040;
      font-size: 32px;
      margin-bottom: 12px;
    }

    p {
      color: #d0d0d0;
      font-size: 18px;
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 28px;
      background: #f0a040;
      color: #151515;
      text-decoration: none;
      font-weight: bold;
      border-radius: 10px;
    }

    .button:hover {
      background: #ffc36b;
    }
  </style>
</head>

<body>
  <main class="container">

    <img
      src="/kofemaster-banner.png"
      alt="Кофемастер PRO — частный мастер по ремонту кофемашин"
      class="master-banner"
    >

    <h1>Кофемастер PRO</h1>

    <p>
      Частный мастер по ремонту и обслуживанию
      автоматических кофемашин и вендингового оборудования.
    </p>

    <p>
      Работаю лично. Выезжаю к клиенту в Москве.
      Ремонт и обслуживание на месте.
      Гарантия на выполненные ремонтные работы.
    </p>

    <a
      class="button"
      href="https://max.ru/channel_kofemaster"
      target="_blank"
    >
      Связаться с мастером
    </a>

  </main>
</body>
</html>
